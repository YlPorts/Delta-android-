plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.ylports.deltaandroid'
    compileSdk 35
    defaultConfig {
        applicationId 'com.ylports.deltaandroid'
        minSdk 24
        targetSdk 35
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
        versionCode 3
        versionName '0.3.0-dev'
        ndk { abiFilters((project.findProperty('deltaAbi') ?: 'arm64-v8a').toString()) }
    }
    signingConfigs {
        debug {
            storeFile file('../keystore/development.jks')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }
    sourceSets { androidTest.assets.srcDir 'build/generated/androidTestAssets' }
    buildFeatures { buildConfig true }
    ndkVersion '27.2.12479018'
    externalNativeBuild {
        cmake {
            path 'src/main/cpp/CMakeLists.txt'
            version '3.22.1'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions { jvmTarget = '17' }
    packaging { jniLibs { useLegacyPackaging = true } }
}

dependencies {
    androidTestImplementation 'androidx.test:runner:1.6.2'
    androidTestImplementation 'androidx.test:core:1.6.1'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
}
